[package]
name = "solidcraft-adapter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The SolidCraft adapter for the B-rep protocol the conformance suite drives: SolidCraft's solidcore kernel"
publish = false

[dependencies]
brep-protocol = "2"
# https://github.com/tangency-labs/solidcraft/releases/tag/v0.47.0, with `VERSION` in src/main.rs:
# the solidcore kernel as SolidCraft ships it, in its solidcore/ folder.
solidcore = { git = "https://github.com/tangency-labs/solidcraft", rev = "56d2ede6f36621ff4e369b7bd5b2c64a6d42d63c" }
# SolidCraft's crates beside the kernel, at the same commit: its modelling layer, the record the
# layers pass bodies in and its conversion, STEP, the mesher, and its kernel boundary's STEP reader.
solidcore-convert = { git = "https://github.com/tangency-labs/solidcraft", rev = "56d2ede6f36621ff4e369b7bd5b2c64a6d42d63c" }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcraft", rev = "56d2ede6f36621ff4e369b7bd5b2c64a6d42d63c" }
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft", rev = "56d2ede6f36621ff4e369b7bd5b2c64a6d42d63c" }
solidcore-step = { git = "https://github.com/tangency-labs/solidcraft", rev = "56d2ede6f36621ff4e369b7bd5b2c64a6d42d63c" }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcraft", rev = "56d2ede6f36621ff4e369b7bd5b2c64a6d42d63c" }
solidcraft-kernel = { git = "https://github.com/tangency-labs/solidcraft", rev = "56d2ede6f36621ff4e369b7bd5b2c64a6d42d63c" }
